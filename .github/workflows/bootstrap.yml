name: Bootstrap Production Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Download final production package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=1CpqVyqd9CKgJuMGfwR1J3oOyF1UCASXp' \
            -o /tmp/control-plane.zip
          test -s /tmp/control-plane.zip
          unzip -t /tmp/control-plane.zip >/dev/null

      - name: Expand final production source
        run: |
          set -euo pipefail
          rm -rf /tmp/control-plane-src
          mkdir -p /tmp/control-plane-src
          unzip -q /tmp/control-plane.zip -d /tmp/control-plane-src
          SOURCE_DIR="$(find /tmp/control-plane-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SOURCE_DIR" ]; then
            echo 'No source directory found in archive' >&2
            exit 1
          fi
          rsync -a --delete --exclude='.git' "$SOURCE_DIR"/ ./
          test -f package.json
          test -f app/page.tsx
          test -f public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf
          if grep -a -q 'RESUME PLACEHOLDER' public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf; then
            echo 'Placeholder resume detected' >&2
            exit 1
          fi

      - name: Commit expanded production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Expand final production source'
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
