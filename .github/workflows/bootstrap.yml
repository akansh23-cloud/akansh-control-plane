name: Bootstrap Production Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Reassemble validated production archive
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/akansh23-cloud/akansh-control-plane/payload-build/payload-new"
          : > /tmp/archive.b64
          for i in 00 01 02 03 04 05; do
            curl --retry 3 --retry-delay 2 -fsSL "$BASE/part$i" >> /tmp/archive.b64
          done
          for i in $(seq -w 0 15); do
            curl --retry 3 --retry-delay 2 -fsSL "$BASE/part06x$i" >> /tmp/archive.b64
          done
          for i in 07 08; do
            curl --retry 3 --retry-delay 2 -fsSL "$BASE/part$i" >> /tmp/archive.b64
          done
          tr -d '\r\n' < /tmp/archive.b64 | base64 --decode > /tmp/control-plane.tar.gz
          test -s /tmp/control-plane.tar.gz
          gzip -t /tmp/control-plane.tar.gz
          tar -tzf /tmp/control-plane.tar.gz >/dev/null

      - name: Expand final production source
        run: |
          set -euo pipefail
          rm -rf /tmp/control-plane-src
          mkdir -p /tmp/control-plane-src
          tar -xzf /tmp/control-plane.tar.gz -C /tmp/control-plane-src
          PACKAGE_JSON="$(find /tmp/control-plane-src -mindepth 1 -maxdepth 5 -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo 'No package.json found in production archive' >&2
            exit 1
          fi
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          rsync -a --delete --exclude='.git' "$SOURCE_DIR"/ ./
          test -f package.json
          test -f app/page.tsx
          test -f public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf
          if grep -a -q 'RESUME PLACEHOLDER' public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf; then
            echo 'Placeholder resume detected' >&2
            exit 1
          fi

      - name: Force Next.js runtime for Vercel
        run: |
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs"
          }
          JSON
          node -e "const p=require('./package.json'); const v=p.dependencies?.next||p.devDependencies?.next; if(!v) process.exit(1); console.log('Next.js dependency:',v)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated production source
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy validated Next.js production source'
            git push
          fi
