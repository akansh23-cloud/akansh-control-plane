name: Bootstrap Production Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Reconstruct embedded production archive
        run: |
          set -euo pipefail
          test -d source-parts
          find source-parts -maxdepth 1 -type f -name 'part*' -print | sort | xargs cat > /tmp/control-plane.b64
          base64 --decode /tmp/control-plane.b64 > /tmp/control-plane.tar.gz
          test -s /tmp/control-plane.tar.gz
          gzip -t /tmp/control-plane.tar.gz
          tar -tzf /tmp/control-plane.tar.gz >/dev/null

      - name: Expand final production source
        run: |
          set -euo pipefail
          rm -rf /tmp/control-plane-src
          mkdir -p /tmp/control-plane-src
          tar -xzf /tmp/control-plane.tar.gz -C /tmp/control-plane-src
          PACKAGE_JSON="$(find /tmp/control-plane-src -mindepth 1 -maxdepth 4 -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo 'No package.json found in embedded archive' >&2
            exit 1
          fi
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          rsync -a --delete --exclude='.git' "$SOURCE_DIR"/ ./
          test -f package.json
          test -f app/page.tsx
          test -f public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf
          if grep -a -q 'RESUME PLACEHOLDER' public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf; then
            echo 'Placeholder resume detected' >&2
            exit 1
          fi

      - name: Force Vercel Next.js preset from source
        run: |
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs"
          }
          JSON

      - name: Commit expanded production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Expand final production source'
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
