name: Vercel Runtime Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pin-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin Node and patched Next.js
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies.next = '14.2.35';
          pkg.engines = { ...(pkg.engines || {}), node: '20.x' };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Commit runtime fix if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Runtime fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Pin Node 20 and update Next.js security patch'
          git pull --rebase origin main
          git push origin HEAD:main
