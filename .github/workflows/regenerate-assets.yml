name: Regenerate Lockworks assets

on:
  push:
    branches:
      - deploy/lockworks-v5-staging

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check reportlab pillow fonttools brotli
      - name: Regenerate committed production assets
        run: npm run assets
        env:
          NEXT_PUBLIC_SITE_URL: https://akansh-mowar-lockworks.vercel.app
      - name: Commit generated assets to this staging branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.assets.json public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf public/og.png public/icon.svg public/favicon.ico public/apple-icon.png
          if git diff --cached --quiet; then
            echo "Generated assets already match source."
            exit 0
          fi
          git commit -m "Regenerate Lockworks v5 production assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
