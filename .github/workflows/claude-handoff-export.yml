name: Claude handoff export

on:
  push:
    branches:
      - handoff/claude-v8-source-2026-08-19

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact handoff branch
        uses: actions/checkout@v4

      - name: Remove handoff-only metadata
        run: |
          rm -rf .git
          rm -f .github/workflows/claude-handoff-export.yml

      - name: Upload production source tree
        uses: actions/upload-artifact@v4
        with:
          name: akansh-control-plane-v8-production-5777b89
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
