name: Lockworks quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
        env:
          # Production cannot ship without fresh evidence; PRs may.
          EVIDENCE_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Performance budget (Lighthouse CI)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload responsive QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockworks-visual-qa
          path: |
            test-results/visual-qa/
            test-results/device-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
