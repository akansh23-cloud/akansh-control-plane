name: Install exact Lockworks rebuild

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install exact Lockworks rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact Lockworks source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .bootstrap/payload/part00
            .bootstrap/payload/part01
            .bootstrap/payload/part02
            .bootstrap/payload/part03
            .bootstrap/fix/04a
            .bootstrap/fix/04b
            .bootstrap/fix/04c0
            .bootstrap/fix/04c1
            .bootstrap/payload/part05
            .bootstrap/payload/part06
            .bootstrap/fix/07a0
            .bootstrap/fix/07a1
            .bootstrap/fix/07b0
            .bootstrap/fix/07b1a
            .bootstrap/fix/07b1b
            .bootstrap/fix/07c0
            .bootstrap/fix/07c1
          )
          cat "${files[@]}" > /tmp/lockworks.b64
          echo '254196faf5be476cc76ecee2257008da8a90dc7dd07b305adfa91d0856e6ba08  /tmp/lockworks.b64' | sha256sum -c -
          base64 -d /tmp/lockworks.b64 > /tmp/lockworks.tar.xz
          echo '9cf6eaf5bfca55b813b3c79c133214519b49581086a28d6674df47ab9c311d17  /tmp/lockworks.tar.xz' | sha256sum -c -
          xz -t /tmp/lockworks.tar.xz
          rm -rf /tmp/lockworks-source
          mkdir -p /tmp/lockworks-source
          tar -xJf /tmp/lockworks.tar.xz -C /tmp/lockworks-source
          test -f /tmp/lockworks-source/package.json
          test -f /tmp/lockworks-source/src/app/page.tsx

      - name: Replace repository with Lockworks source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lockworks-source/. .
          rm -rf .github .vercel node_modules .next qa QA_REFERENCE_CURRENT_FAILURE scripts/.fontcache scripts/__pycache__
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs"
          }
          JSON

      - uses: actions/setup-node@v4
        with:
          node-version: 22
        continue-on-error: true

      - name: Install Node dependencies and create lockfile
        run: npm install

      - name: Install asset generator dependencies
        run: |
          python3 -m venv /tmp/lockworks-venv
          /tmp/lockworks-venv/bin/pip install --quiet pillow reportlab 'fonttools[woff]'
          echo '/tmp/lockworks-venv/bin' >> "$GITHUB_PATH"

      - name: Generate production assets
        run: npm run assets

      - name: Verify production build
        run: |
          npm run audit:source
          npm run typecheck
          npm run test
          npm run assets:check
          npm run lint
          npm run build

      - name: Commit exact Lockworks source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy exact Lockworks rebuild'
          git push origin HEAD:main
