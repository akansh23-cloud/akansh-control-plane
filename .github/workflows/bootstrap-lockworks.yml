name: Install Lockworks rebuild v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-source:
    if: github.event.head_commit.message == 'Finalize Lockworks payload'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1CpqVyqd9CKgJuMGfwR1J3oOyF1UCASXp' -O /tmp/lockworks.zip
          test -s /tmp/lockworks.zip
          unzip -t /tmp/lockworks.zip >/dev/null

      - name: Expand exact production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lockworks-src
          mkdir -p /tmp/lockworks-src
          unzip -q /tmp/lockworks.zip -d /tmp/lockworks-src
          PACKAGE_JSON="$(find /tmp/lockworks-src -mindepth 1 -maxdepth 4 -type f -name package.json -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo 'No package.json found in Lockworks rebuild' >&2
            exit 1
          fi
          SOURCE_DIR="$(dirname "$PACKAGE_JSON")"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='qa' \
            "$SOURCE_DIR"/ ./
          test -f package.json
          test -f src/app/page.tsx
          test -f public/Akansh_Mowar_DevOps_Platform_Engineer_Resume.pdf

      - name: Force Vercel Next.js preset
        shell: bash
        run: |
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs"
          }
          JSON

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source integrity
        run: npm run audit:source

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and factual tests
        run: npm run test

      - name: Validate generated assets
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit exact rebuild source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy Lockworks rebuild v2'
          git push origin HEAD:main
