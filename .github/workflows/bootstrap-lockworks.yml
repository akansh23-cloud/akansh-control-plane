# repaired payload chunks verified — trigger after hash repairs
name: Install Lockworks rebuild v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-source:
    if: github.event.head_commit.message == 'Finalize repaired Lockworks payload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lockworks-src
          cat \
            .bootstrap/payload/part00 \
            .bootstrap/payload/part01 \
            .bootstrap/payload/part02 \
            .bootstrap/payload/part03 \
            .bootstrap/fix/04a \
            .bootstrap/fix/04b \
            .bootstrap/fix/04c0 \
            .bootstrap/fix/04c1 \
            .bootstrap/payload/part05 \
            .bootstrap/payload/part06 \
            .bootstrap/fix/07a0 \
            .bootstrap/fix/07a1 \
            .bootstrap/fix/07b0 \
            .bootstrap/fix/07b1a \
            .bootstrap/fix/07b1b \
            .bootstrap/fix/07c0 \
            .bootstrap/fix/07c1 \
            | base64 -d > /tmp/lockworks.tar.xz
          xz -t /tmp/lockworks.tar.xz
          tar -xJf /tmp/lockworks.tar.xz -C /tmp/lockworks-src
          test -f /tmp/lockworks-src/package.json
          test -f /tmp/lockworks-src/src/app/page.tsx

      - name: Replace repository with rebuild source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lockworks-src/. .
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "nextjs"
          }
          JSON

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Python asset dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/lockworks-venv
          /tmp/lockworks-venv/bin/pip install --quiet pillow reportlab
          echo '/tmp/lockworks-venv/bin' >> "$GITHUB_PATH"

      - name: Generate production assets
        run: npm run assets

      - name: Validate source integrity
        run: npm run audit:source

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and factual tests
        run: npm run test

      - name: Validate generated assets
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit exact rebuild source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy Lockworks rebuild v2'
          git push origin HEAD:main
